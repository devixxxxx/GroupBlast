services:
  - type: web
    name: telegram-auto-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: USER_BOT_TOKEN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
